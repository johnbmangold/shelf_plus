name: shelf_plus
description: "A native-grade Flutter audiobook client for Audiobookshelf."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  cached_network_image: ^4.0.7
  dio: ^5.11.1
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.4
  google_fonts: ^9.0.0
  intl: ^0.20.3
  logging: ^1.3.0
  material_ui: ^1.11.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  socket_io_client: ^3.1.6
  sqlite3_flutter_libs: ^0.6.0+eol
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.17.1
  checks: ^0.4.0
  drift_dev: ^2.35.3
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  shelf: ^1.4.3
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true
