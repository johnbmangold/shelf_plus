name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze_and_test:
    name: Format, Analyze, and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.1"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Run build_runner codegen
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Run static analysis
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Enforce minimum 85% coverage (excluding generated files)
        shell: bash
        run: |
          python3 - <<'PY'
          import sys

          lcov_path = "coverage/lcov.info"
          skip_markers = ("lib/l10n/generated/", ".g.dart", ".freezed.dart")
          total_found = 0
          total_hit = 0
          include_file = True

          with open(lcov_path, "r", encoding="utf-8") as fh:
              for line in fh:
                  line = line.strip()
                  if line.startswith("SF:"):
                      path = line[3:]
                      include_file = not any(m in path for m in skip_markers)
                  elif include_file and line.startswith("LF:"):
                      total_found += int(line[3:])
                  elif include_file and line.startswith("LH:"):
                      total_hit += int(line[3:])

          if total_found == 0:
              print("No coverable lines found in lcov.info", file=sys.stderr)
              sys.exit(1)

          pct = (total_hit / total_found) * 100.0
          print(f"Filtered coverage: {pct:.2f}% ({total_hit}/{total_found})")
          if pct < 85.0:
              print(f"Coverage {pct:.2f}% is below 85.0% threshold", file=sys.stderr)
              sys.exit(1)
          PY

  build_android:
    name: Build Android Flavors
    runs-on: ubuntu-latest
    needs: analyze_and_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.1"
          channel: "stable"
          cache: true

      - name: Install dependencies, l10n, and codegen
        run: >-
          flutter pub get &&
          flutter gen-l10n &&
          dart run build_runner build --delete-conflicting-outputs

      - name: Build dev APK
        run: flutter build apk --debug --flavor dev -t lib/main_dev.dart

      - name: Build prod APK
        run: flutter build apk --debug --flavor prod -t lib/main_prod.dart

  build_ios:
    name: Build iOS Flavors (no codesign)
    runs-on: macos-latest
    needs: analyze_and_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.1"
          channel: "stable"
          cache: true

      - name: Install dependencies, l10n, and codegen
        run: >-
          flutter pub get &&
          flutter gen-l10n &&
          dart run build_runner build --delete-conflicting-outputs

      - name: Build dev iOS app
        run: flutter build ios --debug --no-codesign --flavor dev -t lib/main_dev.dart

      - name: Build prod iOS app
        run: flutter build ios --debug --no-codesign --flavor prod -t lib/main_prod.dart
