name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_status:
        description: "Google Play release status"
        required: false
        type: choice
        default: completed
        options:
          - completed
          - draft

permissions:
  contents: read

jobs:
  analyze_and_test:
    name: Format, Analyze, and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.1"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Run build_runner codegen
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Run static analysis
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Enforce minimum 85% coverage (excluding generated files)
        shell: bash
        run: |
          python3 - <<'PY'
          import sys

          lcov_path = "coverage/lcov.info"
          skip_markers = ("lib/l10n/generated/", ".g.dart", ".freezed.dart")
          total_found = 0
          total_hit = 0
          include_file = True

          with open(lcov_path, "r", encoding="utf-8") as fh:
              for line in fh:
                  line = line.strip()
                  if line.startswith("SF:"):
                      path = line[3:]
                      include_file = not any(m in path for m in skip_markers)
                  elif include_file and line.startswith("LF:"):
                      total_found += int(line[3:])
                  elif include_file and line.startswith("LH:"):
                      total_hit += int(line[3:])

          if total_found == 0:
              print("No coverable lines found in lcov.info", file=sys.stderr)
              sys.exit(1)

          pct = (total_hit / total_found) * 100.0
          print(f"Filtered coverage: {pct:.2f}% ({total_hit}/{total_found})")
          if pct < 85.0:
              print(f"Coverage {pct:.2f}% is below 85.0% threshold", file=sys.stderr)
              sys.exit(1)
          PY

  build_android:
    name: Build Android Flavors
    runs-on: ubuntu-latest
    needs: analyze_and_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.1"
          channel: "stable"
          cache: true

      - name: Install dependencies, l10n, and codegen
        run: >-
          flutter pub get &&
          flutter gen-l10n &&
          dart run build_runner build --delete-conflicting-outputs

      - name: Build dev APK
        run: flutter build apk --debug --flavor dev -t lib/main_dev.dart

      - name: Build prod APK
        run: flutter build apk --debug --flavor prod -t lib/main_prod.dart

  build_ios:
    name: Build iOS Flavors (no codesign)
    runs-on: macos-latest
    needs: analyze_and_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.1"
          channel: "stable"
          cache: true

      - name: Install dependencies, l10n, and codegen
        run: >-
          flutter pub get &&
          flutter gen-l10n &&
          dart run build_runner build --delete-conflicting-outputs

      - name: Build dev iOS app
        run: flutter build ios --debug --no-codesign --flavor dev -t lib/main_dev.dart

      - name: Build prod iOS app
        run: flutter build ios --debug --no-codesign --flavor prod -t lib/main_prod.dart

  deploy_android_internal:
    name: Deploy Android Internal
    runs-on: ubuntu-latest
    needs: analyze_and_test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    concurrency:
      group: deploy-android-internal
      cancel-in-progress: false
    steps:
      - name: Verify required secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=()
          for var in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD \
            GOOGLE_PLAY_SERVICE_ACCOUNT_JSON; do
            if [ -z "${!var}" ]; then
              missing+=("$var")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "Missing required GitHub Actions secrets: ${missing[*]}" >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.1"
          channel: "stable"
          cache: true

      - name: Install dependencies, l10n, and codegen
        run: >-
          flutter pub get &&
          flutter gen-l10n &&
          dart run build_runner build --delete-conflicting-outputs

      - name: Configure Android signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          {
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=%s\n' "$RUNNER_TEMP/upload-keystore.jks"
          } > android/key.properties

      - name: Build prod release AAB
        run: flutter build appbundle --release --flavor prod -t lib/main_prod.dart --build-number "${{ github.run_number }}"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-prod-release-${{ github.run_number }}
          path: build/app/outputs/bundle/prodRelease/app-prod-release.aab
          retention-days: 14

      - name: Upload to Google Play Console (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.shcworks.shelfplus
          releaseFiles: build/app/outputs/bundle/prodRelease/app-prod-release.aab
          tracks: internal
          status: ${{ inputs.release_status || 'completed' }}

      - name: Clean up signing files
        if: always()
        shell: bash
        run: rm -f android/key.properties "$RUNNER_TEMP/upload-keystore.jks"
